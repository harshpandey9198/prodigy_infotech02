<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Employee Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="login-container">
    <div class="login-card fade-in">
      <!-- Icon -->
      <div class="text-center mb-4">
        <div class="login-icon mx-auto">
          <i class="bi bi-shield-lock-fill fs-1"></i>
        </div>
      </div>

      <!-- Title -->
      <h3 class="text-center login-title">Employee Management System</h3>
      <p class="text-center login-subtitle">Prodigy Infotech — Admin Portal</p>

      <!-- Error Alert -->
      <div class="alert alert-danger d-none" id="loginError" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" class="form-control" id="username" placeholder="Enter username" required autocomplete="username" />
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Enter password" required autocomplete="current-password" />
            <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-login w-100" id="loginBtn">
          <span class="spinner-border spinner-border-sm d-none" id="loginSpinner" role="status"></span>
          <span id="loginBtnText">Sign In</span>
        </button>
      </form>

      <div class="text-center mt-4">
        <small class="text-muted">Default: admin / Admin@123</small>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
