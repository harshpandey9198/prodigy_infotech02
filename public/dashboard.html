<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Employee Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="/dashboard">
        <i class="bi bi-people-fill me-2"></i>EMS
      </a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-light">
          <i class="bi bi-person-circle me-1"></i>
          <span id="adminUsername">Admin</span>
        </span>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid py-4 px-4">
    <!-- Stats Cards -->
    <div class="row g-4 mb-4">
      <div class="col-md-4">
        <div class="stat-card bg-primary">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="stat-number" id="totalEmployees">0</div>
              <div class="stat-label">Total Employees</div>
            </div>
            <div class="stat-icon">
              <i class="bi bi-people fs-4"></i>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card bg-success">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="stat-number" id="totalDepartments">0</div>
              <div class="stat-label">Departments</div>
            </div>
            <div class="stat-icon">
              <i class="bi bi-building fs-4"></i>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card bg-info">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="stat-number" id="avgSalary">₹0</div>
              <div class="stat-label">Avg Salary</div>
            </div>
            <div class="stat-icon">
              <i class="bi bi-currency-rupee fs-4"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row align-items-center g-3">
          <div class="col-md-8">
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control" id="searchInput" placeholder="Search employees by name, email, or department..." />
            </div>
          </div>
          <div class="col-md-4 text-md-end">
            <button class="btn btn-success" id="addEmployeeBtn">
              <i class="bi bi-plus-circle me-1"></i>Add Employee
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Employee Table -->
    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Department</th>
              <th>Designation</th>
              <th>Salary</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="employeeTableBody">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="card-footer bg-white d-flex justify-content-center">
        <nav>
          <ul class="pagination mb-0" id="pagination"></ul>
        </nav>
      </div>
    </div>
  </div>

  <!-- Add/Edit Employee Modal -->
  <div class="modal fade" id="employeeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="employeeModalLabel">Add New Employee</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="employeeForm" novalidate>
            <input type="hidden" id="employeeId" />
            <div class="row g-3">
              <div class="col-md-6">
                <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="firstName" placeholder="Enter first name" required />
                <div class="invalid-feedback" id="firstNameError"></div>
              </div>
              <div class="col-md-6">
                <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="lastName" placeholder="Enter last name" required />
                <div class="invalid-feedback" id="lastNameError"></div>
              </div>
              <div class="col-md-6">
                <label for="employeeEmail" class="form-label">Email <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="employeeEmail" placeholder="Enter email" required />
                <div class="invalid-feedback" id="emailError"></div>
              </div>
              <div class="col-md-6">
                <label for="phone" class="form-label">Phone <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="phone" placeholder="10-digit number" required maxlength="10" />
                <div class="invalid-feedback" id="phoneError"></div>
              </div>
              <div class="col-md-6">
                <label for="department" class="form-label">Department <span class="text-danger">*</span></label>
                <select class="form-select" id="department" required>
                  <option value="">Select Department</option>
                </select>
                <div class="invalid-feedback" id="departmentError"></div>
              </div>
              <div class="col-md-6">
                <label for="designation" class="form-label">Designation <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="designation" placeholder="Enter designation" required />
                <div class="invalid-feedback" id="designationError"></div>
              </div>
              <div class="col-md-6">
                <label for="salary" class="form-label">Salary (₹) <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="salary" placeholder="Enter salary" step="0.01" min="0" required />
                <div class="invalid-feedback" id="salaryError"></div>
              </div>
              <div class="col-md-6">
                <label for="dateOfJoining" class="form-label">Date of Joining <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="dateOfJoining" required />
                <div class="invalid-feedback" id="dateError"></div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" id="saveEmployeeBtn">
            <span class="spinner-border spinner-border-sm d-none" id="saveSpinner" role="status"></span>
            Save Employee
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title"><i class="bi bi-exclamation-triangle me-2"></i>Confirm Delete</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <i class="bi bi-trash3 text-danger" style="font-size: 3rem;"></i>
          <p class="mt-3">Are you sure you want to delete this employee?<br><strong>This action cannot be undone.</strong></p>
          <input type="hidden" id="deleteEmployeeId" />
        </div>
        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
            <i class="bi bi-trash3 me-1"></i>Delete
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
    <div class="toast align-items-center text-white border-0" id="notificationToast" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastMessage"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/employees.js"></script>
</body>
</html>
